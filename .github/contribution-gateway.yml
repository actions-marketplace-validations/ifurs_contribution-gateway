# This repository checks its own pull requests. Options and defaults:
# examples/contribution-gateway.yml
mode: enforce

rules:
  linked_issue:
    enabled: true
    require_open: true
  checklist:
    enabled: true
    require_all_checked: true
    min_items: 3             # the three items in .github/pull_request_template.md
  disclosure:
    enabled: true
    heading: "AI usage"

on_violation:
  comment: true
  label: needs-policy-fixes
  close: false
  fail_check: true
  intro: "Thanks for contributing! This repository checks its own pull requests with Contribution Gateway. How to contribute is in CONTRIBUTING.md."
