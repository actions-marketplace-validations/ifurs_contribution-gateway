# Copy to .github/workflows/contribution-gateway.yml
#
# Two-workflow mode, part 2 of 2. Starts when the trigger workflow finishes, runs with this
# repository's own workflow file and token, finds the pull request through the API, and
# reports with a commit status called "contribution-gateway". It never checks out or runs
# pull request code. Mark that status as required in branch protection to block merging.
name: Contribution gateway

on:
  workflow_run:
    workflows: ["Contribution gateway trigger"]   # must match the trigger workflow's name
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-check
        required: true

permissions:
  contents: read        # read the policy file from the base branch
  issues: write         # comments and labels (PRs are issues in the API)
  pull-requests: write  # read PRs; close them if the policy says to
  statuses: write       # the "contribution-gateway" status on the PR

concurrency:
  group: contribution-gateway-${{ github.event.workflow_run.head_repository.full_name || 'manual' }}-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: ifurs/contribution-gateway@v0
        with:
          pull-request: ${{ inputs.pr }}
