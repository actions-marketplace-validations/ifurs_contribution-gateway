# Copy to .github/workflows/contribution-gateway.yml
#
# Single-workflow mode. Simple, but from December 2, 2026 GitHub blocks pull_request_target
# in public repositories unless an Actions event policy allows it for this workflow file.
# For public repositories, prefer the two-workflow setup in examples/two-workflow/.
#
# The result is this job's own check ("gate"). A pull request can add its own workflow with a
# job of the same name that passes, so don't rely on "gate" as a required status check; use
# two-workflow mode if you need a check that can gate merging.
name: Contribution gateway

on:
  # pull_request_target runs in the context of the base repository, so it can comment on
  # and label pull requests from forks. It is safe here because this workflow never checks
  # out or runs the pull request's code. Do not add actions/checkout of the PR head to it.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read        # read the policy file from the base branch
  issues: write         # comments and labels (PRs are issues in the API)
  pull-requests: write  # comment on and label PRs (required even with issues: write), close if the policy says to

concurrency:
  group: contribution-gateway-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # For production, pin a full commit SHA instead of the moving v0 tag, e.g.
      #   uses: ifurs/contribution-gateway@<40-character SHA>  # v0.3.1
      - uses: ifurs/contribution-gateway@v0
