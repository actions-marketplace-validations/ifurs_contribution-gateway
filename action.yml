name: Contribution Gateway
description: Checks pull requests against a maintainer-written policy (linked issue, newcomer PR limit, checklist, disclosure) with clear, friendly feedback. Runs on pull_request_target or workflow_run.
author: contribution-gateway contributors
branding:
  icon: shield
  color: green
inputs:
  github-token:
    description: Token used to read issues and post comments and labels.
    default: ${{ github.token }}
  config-path:
    description: Path of the policy file, read from the pull request's base branch.
    default: .github/contribution-gateway.yml
  pull-request:
    description: Check this PR number instead of the one from the event (for manual workflow_dispatch runs).
    default: ""
outputs:
  passed:
    description: '"true" when every checked pull request meets the policy or is exempt.'
  violations:
    description: JSON list of failed rules, each with `pull_request`, `rule` and `message`.
runs:
  using: node24
  main: dist/index.mjs
